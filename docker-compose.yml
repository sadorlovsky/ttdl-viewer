services:
  ttdl-viewer:
    # Built from this checkout. To run a published image instead, comment `build` out and
    # uncomment `image` — pin the version rather than following `latest` on a machine you do not
    # want changing under you. See https://ttdl-viewer.orlovsky.dev/guides/docker/ for the tags.
    build: .
    # image: ghcr.io/sadorlovsky/ttdl-viewer:0.1.0
    container_name: ttdl-viewer
    restart: unless-stopped

    volumes:
      # Left side: where ttdl writes its archives. Right side must stay /archives, which is what
      # TTDL_VIEWER_ROOT points at inside the container.
      #
      # :ro is the point. The viewer never writes to an archive by design; mounting read-only
      # turns that from a promise into something the kernel enforces, so no bug in here can ever
      # damage a download that took hours to fetch.
      - ${TTDL_ARCHIVES:-./downloads}:/archives:ro

      # Saving dates need no volume of their own: ttdl caches them as .liked.json inside the
      # archive, which is already mounted below. An export unpacked inside the archive root is
      # picked up too. Mount it separately only if you keep it somewhere else entirely, and then
      # point TTDL_VIEWER_LIKES at it.
      # - ${TTDL_EXPORT:-./export}:/export:ro

    # Uncomment both lines together. A bare `environment:` with nothing but a comment under it
    # parses as null, which compose versions that validate the file reject outright — and the
    # quick start in the README is the first thing that would fail.
    # environment:
    #   - TTDL_VIEWER_LIKES=/export/Likes and Favorites

    ports:
      # Bind to the host's loopback only, so the viewer is reachable from the NAS itself and over
      # a VPN or SSH tunnel, but is not sitting on the LAN. Change to "4174:4174" to expose it to
      # your whole local network — there is no authentication in front of it, so only do that on a
      # network you trust.
      - "127.0.0.1:4174:4174"

    # Synology shares are often owned by a specific DSM user rather than being world-readable. If
    # the container starts but reports zero archives, the mount is likely unreadable to the `bun`
    # user — find the owner with `ls -ln` on the share and set it here as "UID:GID".
    # user: "1026:100"

    # No healthcheck here: the image carries the same one, and reads the port from its environment
    # rather than naming it. This copy was exec form, where a variable is not expanded, so it went
    # on probing 4174 whatever the port was actually set to.
