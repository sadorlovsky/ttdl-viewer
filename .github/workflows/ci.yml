name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release calls this workflow before it publishes anything, so a tag can never produce an
  # image from a tree that does not pass its own checks.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.0"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # Nothing here writes anything back, and the edge job below declares its own. Without this the
    # job takes whatever the repository hands out by default.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun test
      - run: bun run typecheck
      - run: bun run lint

      # `build` is vite followed by check-offline, which fails on any remote reference in dist/.
      - run: bun run build

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: bun run build

  edge:
    name: Edge image
    needs: checks
    # Only a push that lands on main. When Release calls this workflow the ref is a tag, so this
    # job is skipped and the tagged image is built by Release instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Hand-written labels would leave the base image's own in place, and `docker inspect` on a
      # pull would report the title, description and URL of Bun. metadata-action writes the whole
      # set from this repository.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.documentation=https://ttdl-viewer.orlovsky.dev

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
